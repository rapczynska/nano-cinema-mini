name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci

      # App, solutions and lab checks compile.
      - run: npm run typecheck

      # Every lab check passes against the solutions in workshop/solutions.
      - run: npm run lab:verify

      # The app builds with the starter exercises.
      - run: npm run build
